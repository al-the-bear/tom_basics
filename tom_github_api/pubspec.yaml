name: tom_github_api
description: Typed Dart client for the GitHub API — issues, labels, comments, search, workflows, repositories, repository contents, the low-level git data API, and a GraphQL entry point for the surfaces REST does not reach.
version: 1.3.0
repository: https://github.com/al-the-bear/tom_basics

environment:
  sdk: ^3.10.8

dependencies:
  # Content-addressed object shas of the in-memory GitHub (testing.dart).
  crypto: ^3.0.0
  http: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
