name: tom_crypto_sample
description: >-
  Runnable, article-grade sample for tom_crypto: password hashing with Argon2,
  JWT issue/verify with an encrypted payload section, and RSA encrypt/decrypt,
  sign/verify, and key-generation round trips — every example deterministic and
  offline so the whole set runs in CI.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  tom_crypto:
    path: ../../tom_crypto
  # Imported directly to call JWT.verify and to name the JWTException it
  # throws. Neither appears in tom_crypto's own public API, so neither is among
  # the dart_jsonwebtoken names tom_crypto re-exports; the types that do appear
  # there -- JWTAlgorithm, SecretKey, and the pointycastle RSA key pair -- now
  # arrive through the tom_crypto barrel and need no direct dependency.
  dart_jsonwebtoken: ^3.1.1

dev_dependencies:
  lints: ^6.0.0
