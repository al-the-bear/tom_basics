# Default test configuration for tom_build_kit.
# Use expanded reporter so per-test verbose output (TestLogger) is visible.
reporter: expanded

# Run test files one at a time. Each integration suite works in its own scratch
# copy of the workspace (test/helpers/scratch_workspace.dart), so they no longer
# share workspace files; running them in parallel has not been verified (they
# still share .test-log/ and $HOME-level state).
concurrency: 1
