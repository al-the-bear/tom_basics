name: tom_build_kit
description: Build orchestration tool with pipelines that integrates Tom build tools.
version: 1.13.0
repository: https://github.com/al-the-bear/tom_basics

environment:
  sdk: ^3.10.4

dependencies:
  # The :unreferenced audit reads a library's declarations with the parser.
  analyzer: ^14.0.0
  args: ^2.7.0
  dcli: ^10.0.0
  glob: ^2.1.3
  meta: ^1.16.0
  path: ^1.9.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.1
  console_markdown: ^0.0.3
  tom_build_base: ^2.18.0

dev_dependencies:
  build_runner: ^2.4.15
  # The workspace clone the integration suites run on (TomWorkspaceClone).
  # By path, the workspace's development mode; the staged copy that
  # publishes this package drops path dev dependencies.
  tom_test_support:
    path: ../tom_test_support
  lints: ^6.0.0
  test: ^1.25.6

executables:
  buildkit:
  findproject:
