name: tom_pqc
description: >-
  Post-quantum cryptography for Dart: ML-KEM-768, ML-DSA-65, X-Wing and
  composite ML-DSA-65 + Ed25519 (RFC 10073), via FFI to vendored
  mlkem-native and mldsa-native C code.
version: 0.1.0
repository: https://github.com/al-the-bear/tom_basics
topics:
  - cryptography
  - post-quantum
  - ffi

environment:
  sdk: ^3.10.0

dependencies:
  # The build hook: compiling the vendored C per target (hook/build.dart).
  code_assets: ^1.2.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.2
  # Calloc for the buffers handed to the C code.
  ffi: ^2.1.3
  # The classical halves of the hybrids: X25519 (MLKEM768-X25519) and
  # Ed25519 (the composite signature). Apache-2.0.
  cryptography: ^2.9.0
  # SHA-512, the composite signature's pre-hash.
  crypto: ^3.0.6
  meta: ^1.15.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.25.6
  # The dependency-closure walk and licence classification of
  # test/licence_test.dart (licence_audit.dart).
  tom_test_support:
    path: ../tom_test_support
