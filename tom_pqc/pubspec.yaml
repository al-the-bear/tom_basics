name: tom_pqc
description: >-
  Post-quantum cryptography for Dart: ML-KEM-768 (FIPS 203) through FFI to
  the vendored mlkem-native C code, built per platform by a build hook, behind
  a backend interface. Tested with the NIST ACVP known-answer vectors.
version: 0.1.0
repository: https://github.com/al-the-bear/tom_basics
topics:
  - cryptography
  - post-quantum
  - ffi

environment:
  sdk: ^3.10.0

dependencies:
  # The build hook: compiling the vendored C per target (hook/build.dart).
  code_assets: ^1.2.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.2
  # Calloc for the buffers handed to the C code.
  ffi: ^2.1.3
  meta: ^1.15.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.25.6
  # The dependency-closure walk and licence classification of
  # test/licence_test.dart (licence_audit.dart).
  tom_test_support:
    path: ../tom_test_support
