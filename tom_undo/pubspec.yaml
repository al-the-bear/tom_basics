name: tom_undo
description: >-
  The undo/redo stack every undo history runs on: a bounded stack that applies
  an entry before moving it, so a failing undo stays undoable, and composite
  steps that put back what they applied when one part fails. No dependencies.
version: 0.1.0
repository: https://github.com/al-the-bear/tom_basics

environment:
  sdk: ^3.10.8

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
