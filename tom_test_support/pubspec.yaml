name: tom_test_support
description: >-
  Test support for Tom suites: roots by landmark, a workspace clone for build-tool tests, the Dart CLI, live-GitHub gating, a Docker Gitea and a licence audit.
version: 0.6.1
repository: https://github.com/al-the-bear/tom_basics

environment:
  sdk: ^3.10.0

dependencies:
  # Talking to the disposable Gitea server (gitea.dart).
  http: ^1.2.0
  # Joining and naming paths.
  path: ^1.9.0
  # The credential the live contract classifies (github_live.dart).
  tom_github_api:
    path: ../tom_github_api
  # Reading each linked package's pubspec (licence_audit.dart).
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
